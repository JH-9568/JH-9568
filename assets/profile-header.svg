    <ellipse cx="772" cy="128" rx="140" ry="57" pathLength="100" stroke="#d9f995" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 88" stroke-dashoffset="-7"/>
  </g>
  <path d="M766 128h12m-6-6v12" stroke="#8491a4" stroke-width=".8"/>
