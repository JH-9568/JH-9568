<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="title desc">
  <title id="title">Build. Learn. Repeat.</title>
  <desc id="desc">Jinhyeong Jeong's digital studio. Charcoal, silver and lime, with an orbit representing the cycle of building and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#171a20"/><stop offset=".65" stop-color="#272e38"/><stop offset="1" stop-color="#171a20"/></linearGradient>
    <linearGradient id="metal" x1="640" y1="210" x2="905" y2="55" gradientUnits="userSpaceOnUse"><stop stop-color="#a5b8df" stop-opacity=".25"/><stop offset=".5" stop-color="#edf2fc"/><stop offset="1" stop-color="#a5b8df" stop-opacity=".3"/></linearGradient>
  </defs>
  <rect width="960" height="248" rx="4" fill="url(#bg)"/>
  <circle cx="42" cy="34" r="3" fill="#d9f995"/>
  <text x="56" y="38" fill="#b9c1ce" font-family="monospace" font-size="11" letter-spacing="1.7">JINHYEONG JEONG / DIGITAL STUDIO</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="500" letter-spacing="-3.5">
    <text x="38" y="114" fill="#f4f5f7">Build. Learn.</text>
    <text x="38" y="177" fill="#b8c8e5">Repeat.</text>
  </g>
  <path d="M42 189 Q151 179 248 185" fill="none" stroke="#b8c8e5" stroke-width="1"/>
  <text x="42" y="225" fill="#9da8ba" font-family="monospace" font-size="10" letter-spacing="1.4">AI PRODUCTS · WEB · MOBILE</text>
  <g transform="rotate(-24 772 128)" fill="none">
